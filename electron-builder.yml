appId: com.r2cuerdame.prism
productName: Prism
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asar: true
electronDist: node_modules/electron/dist
win:
  target:
    - nsis
# latest.yml names the asset without spaces; keep the file on disk matching it
# or a hand-uploaded GitHub release turns spaces into dots and every client 404s.
artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: r2cuerdame
  repo: Prism
