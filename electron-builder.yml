appId: com.r2cuerdame.gptbrowser
productName: GPTBrowser
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asar: true
win:
  target:
    - nsis
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: r2cuerdame
  repo: GPTBrowser
